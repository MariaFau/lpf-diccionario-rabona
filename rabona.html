<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rabona Motion Prototype</title>
<style>
  :root {
    --bg: #000;
    --ink: #e9e6df;
    --ink-dim: #8a9097;
    --accent: #5b6b7a;
    --gold: #c9a84a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--ink);
    font: 13px/1.4 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.04em;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px;
    overflow: hidden;
  }
  .stage {
    width: min(100%, calc((100vh - 90px) * 16 / 9));
    aspect-ratio: 16 / 9;
    position: relative;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: #000;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    color: var(--ink-dim);
    width: min(100%, calc((100vh - 90px) * 16 / 9));
  }
  .controls button {
    background: none;
    border: 1px solid #3a434c;
    color: var(--ink);
    padding: 5px 10px;
    font: inherit;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 11px;
    cursor: pointer;
  }
  .controls button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  .controls input[type=range] { flex: 1; min-width: 160px; accent-color: #8fa0b0; }
  .controls .t { font-variant-numeric: tabular-nums; min-width: 52px; color: var(--ink); }
  .controls .keys { font-size: 11px; }
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="controls">
  <button id="play" aria-pressed="true">Pause</button>
  <button id="slow" aria-pressed="false">0.25×</button>
  <button id="debug" aria-pressed="false">Debug</button>
  <button id="ghost" aria-pressed="false">Ghosts</button>
  <input id="scrub" type="range" min="0" max="2.4" step="0.001" value="0">
  <span class="t" id="tlabel">0.00 s</span>
  <span class="keys">space · ← → · S · D · G</span>
</div>
<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------
  //  Scene constants (canvas space is fixed at 1920x1080, camera static)
  // ---------------------------------------------------------------
  const W = 1920, H = 1080;
  const DURATION = 2.4;       // the animation itself
  const LOOP_HOLD = 0.9;      // pause on the last frame before looping
  const GROUND_Y = 900;

  // Player faces screen-left, chest turned 3/4 toward camera.
  // Left-footed rabona:
  //   SUPPORT leg = player's RIGHT leg (screen-left), foot never moves.
  //   KICK leg    = player's LEFT leg (screen-right), always drawn on the
  //                 layer BEHIND the support leg.
  const SUPPORT_ANKLE = { x: 955, y: 870 };
  const SUPPORT_TOE   = { x: -60, y: 16 };   // boot direction (toe vector)
  const THIGH = 160, SHIN = 160;              // support leg segment lengths (IK)
  const HIP_HALF = 34;                        // half pelvis width

  const BALL_REST = { x: 762, y: 870 };
  const BALL_R = 30;
  const T_CONTACT = 1.66;

  const COL = {
    ink: '#ece9e2',
    inkSoft: '#b9b6ae',
    gray: '#8a9097',
    blue: '#5b6b7a',
    blueDeep: '#1f2934',
    blueFill: '#2b3845',
    blueLine: '#9fb2c4',
    gold: '#c9a84a',
    black: '#050505',
  };

  // ---------------------------------------------------------------
  //  Key poses. Kick leg is driven by explicit knee + ankle waypoints
  //  (NOT a rotation around the hip), so the foot follows a routed path
  //  that goes around the back of the support shin.
  //
  //  Fields:
  //   pelvis      pelvis centre
  //   neck        base of neck
  //   kKnee/kAnk  kick-leg knee and ankle
  //   kToe        kick boot direction vector
  //   fShoulder.. far arm (player's left, screen-right)
  //   nShoulder.. near arm (player's right, screen-left)
  // ---------------------------------------------------------------
  const P = (x, y) => ({ x, y });

  const POSE_A = {
    name: 'A', label: 'PREPARATION',
    pelvis: P(1000, 555), neck: P(982, 330),
    kKnee: P(1078, 712), kAnk: P(1138, 858), kToe: P(-38, 36),
    fElbow: P(1098, 420), fHand: P(1140, 500),
    nElbow: P(900, 420), nHand: P(850, 495),
  };
  // Back-lift: heel rises behind the body, still on the kick-leg side.
  const POSE_LIFT = {
    name: 'lift',
    pelvis: P(1002, 560), neck: P(990, 334),
    kKnee: P(1096, 690), kAnk: P(1226, 752), kToe: P(-14, 52),
    fElbow: P(1110, 380), fHand: P(1190, 350),
    nElbow: P(885, 405), nHand: P(812, 440),
  };
  // From here to contact the kick ankle travels along ONE continuous line:
  //   approach → behind the support shin → emerged on the ball side → ball.
  // All four ankle positions lie on  contact + k·(1, -0.45),  so the foot
  // never changes course after it comes out from behind the support leg.
  const STRIKE_LINE = (k) => P(846 + k, 850 - 0.45 * k);

  // Approach: ankle arrives at the back edge of the support shin.
  const POSE_APPROACH = {
    name: 'approach',
    pelvis: P(1004, 563), neck: P(996, 336),
    kKnee: P(1066, 692), kAnk: STRIKE_LINE(154), kToe: P(-44, 38),
    fElbow: P(1118, 370), fHand: P(1205, 335),
    nElbow: P(880, 400), nHand: P(800, 425),
  };
  // POSE B — LEG CROSSING BEHIND: ankle directly behind the support shin.
  const POSE_B = {
    name: 'B', label: 'LEG CROSSING BEHIND',
    pelvis: P(1005, 565), neck: P(998, 337),
    kKnee: P(1020, 705), kAnk: STRIKE_LINE(94), kToe: P(-50, 28),
    fElbow: P(1120, 369), fHand: P(1209, 332),
    nElbow: P(877, 399), nHand: P(796, 421),
  };
  // POSE C — CROSSED POSITION: shins form an X, boot out on the ball side.
  const POSE_C = {
    name: 'C', label: 'CROSSED POSITION',
    pelvis: P(1006, 566), neck: P(1000, 338),
    kKnee: P(995, 722), kAnk: STRIKE_LINE(44), kToe: P(-54, 24),
    fElbow: P(1122, 368), fHand: P(1212, 330),
    nElbow: P(875, 398), nHand: P(792, 418),
  };
  // POSE D — CONTACT: the same foot, still on the same line, meets the ball.
  const POSE_D = {
    name: 'D', label: 'CONTACT',
    pelvis: P(1004, 569), neck: P(999, 340),
    kKnee: P(975, 735), kAnk: STRIKE_LINE(0), kToe: P(-54, 22),
    fElbow: P(1125, 372), fHand: P(1215, 340),
    nElbow: P(872, 402), nHand: P(788, 430),
  };
  // Follow-through: foot keeps going along the line, then decelerates.
  const POSE_FOLLOW = {
    name: 'follow',
    pelvis: P(1002, 569), neck: P(997, 340),
    kKnee: P(966, 738), kAnk: STRIKE_LINE(-32), kToe: P(-54, 18),
    fElbow: P(1120, 376), fHand: P(1208, 352),
    nElbow: P(876, 405), nHand: P(794, 438),
  };
  const POSE_SETTLE = {
    name: 'settle',
    pelvis: P(1000, 568), neck: P(995, 339),
    kKnee: P(964, 732), kAnk: P(806, 852), kToe: P(-55, 10),
    fElbow: P(1115, 382), fHand: P(1198, 368),
    nElbow: P(880, 408), nHand: P(800, 445),
  };

  // Timeline. `flat` = zero velocity at that key (a hold). No holds between
  // the approach and the follow-through: the foot never stops before contact.
  const KEYS = [
    { t: 0.00, pose: POSE_A, flat: true },
    { t: 0.50, pose: POSE_A, flat: true },
    { t: 0.70, pose: POSE_LIFT },
    { t: 0.92, pose: POSE_APPROACH },
    { t: 1.14, pose: POSE_B },
    { t: 1.40, pose: POSE_C },
    { t: 1.66, pose: POSE_D },
    { t: 1.90, pose: POSE_FOLLOW },
    { t: 2.40, pose: POSE_SETTLE, flat: true },
  ];
  // Keyframe-sheet moments
  const SHEET = [
    { t: 0.40, id: 'A', label: 'PREPARATION' },
    { t: 1.14, id: 'B', label: 'LEG CROSSING BEHIND' },
    { t: 1.40, id: 'C', label: 'CROSSED POSITION' },
    { t: 1.66, id: 'D', label: 'CONTACT' },
    { t: 1.80, id: 'E', label: 'BALL LEAVING THE FOOT' },
  ];
  const POINT_FIELDS = Object.keys(POSE_A).filter(k => typeof POSE_A[k] === 'object');

  // ---------------------------------------------------------------
  //  Interpolation: non-uniform cubic Hermite (Catmull-Rom tangents
  //  scaled by real key spacing) so the path is smooth through waypoints.
  // ---------------------------------------------------------------
  function tangent(i, f, axis) {
    const k = KEYS[i];
    if (k.flat || i === 0 || i === KEYS.length - 1) return 0;
    const a = KEYS[i - 1], b = KEYS[i + 1];
    const m = (b.pose[f][axis] - a.pose[f][axis]) / (b.t - a.t);
    return m * (k.damp ?? 1);
  }
  function hermite(p0, p1, m0, m1, dt, u) {
    const u2 = u * u, u3 = u2 * u;
    return (2*u3 - 3*u2 + 1) * p0 + (u3 - 2*u2 + u) * dt * m0
         + (-2*u3 + 3*u2) * p1 + (u3 - u2) * dt * m1;
  }
  function sampleRig(t) {
    t = Math.max(0, Math.min(DURATION, t));
    let i = 0;
    while (i < KEYS.length - 2 && t > KEYS[i + 1].t) i++;
    const a = KEYS[i], b = KEYS[i + 1];
    const dt = b.t - a.t;
    const u = dt > 0 ? (t - a.t) / dt : 0;
    const rig = {};
    for (const f of POINT_FIELDS) {
      rig[f] = {
        x: hermite(a.pose[f].x, b.pose[f].x, tangent(i, f, 'x'), tangent(i + 1, f, 'x'), dt, u),
        y: hermite(a.pose[f].y, b.pose[f].y, tangent(i, f, 'y'), tangent(i + 1, f, 'y'), dt, u),
      };
    }
    return solveRig(rig);
  }

  // ---------------------------------------------------------------
  //  Rig solve: derived joints + support-leg IK (ankle is pinned).
  // ---------------------------------------------------------------
  const add = (a, b) => ({ x: a.x + b.x, y: a.y + b.y });
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const mul = (a, s) => ({ x: a.x * s, y: a.y * s });
  const len = a => Math.hypot(a.x, a.y);
  const norm = a => { const l = len(a) || 1; return { x: a.x / l, y: a.y / l }; };
  const lerpP = (a, b, u) => ({ x: a.x + (b.x - a.x) * u, y: a.y + (b.y - a.y) * u });

  function twoBoneIK(hip, ankle, l1, l2, bendSign) {
    const d = sub(ankle, hip);
    let dist = Math.min(len(d), l1 + l2 - 0.01);
    const dir = norm(d);
    const a = (l1 * l1 - l2 * l2 + dist * dist) / (2 * dist);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    const perp = { x: -dir.y * bendSign, y: dir.x * bendSign };
    return add(add(hip, mul(dir, a)), mul(perp, h));
  }

  function solveRig(r) {
    // pelvis tilts slightly as weight drops onto the support leg
    const tilt = (r.pelvis.y - 555) * 0.004;
    const across = { x: Math.cos(tilt), y: Math.sin(tilt) };
    r.sHip = sub(r.pelvis, mul(across, HIP_HALF));     // support (screen-left)
    r.kHip = add(r.pelvis, mul(across, HIP_HALF));     // kick (screen-right)
    r.sAnk = { ...SUPPORT_ANKLE };                     // PINNED — never animated
    r.sToe = SUPPORT_TOE;
    // knee bends forward = toward screen-left
    r.sKnee = twoBoneIK(r.sHip, r.sAnk, THIGH, SHIN, 1);
    const spine = norm(sub(r.neck, r.pelvis));
    const right = { x: -spine.y, y: spine.x };          // screen-right across the torso
    r.fShoulder = add(r.neck, add(mul(right, 50), mul(spine, -18)));
    r.nShoulder = add(r.neck, add(mul(right, -46), mul(spine, -14)));
    r.head = add(r.neck, add(mul(spine, 62), { x: -14, y: 0 }));
    return r;
  }

  // ---------------------------------------------------------------
  //  Ball
  // ---------------------------------------------------------------
  function ballState(t) {
    if (t <= T_CONTACT) return { x: BALL_REST.x, y: BALL_REST.y, rot: 0, squash: 0, moving: false, p: 0 };
    const p = Math.min(1, (t - T_CONTACT) / (DURATION - T_CONTACT));
    const e = 1 - Math.pow(1 - p, 1.6);
    const x = BALL_REST.x - 640 * e;
    const y = BALL_REST.y - 250 * Math.sin(e * Math.PI * 0.62);
    const squash = Math.max(0, 1 - (t - T_CONTACT) / 0.07) * 0.18;
    return { x, y, rot: -e * 11, squash, moving: true, p };
  }

  // ---------------------------------------------------------------
  //  Drawing primitives
  // ---------------------------------------------------------------
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  function capsulePath(c, p1, r1, p2, r2) {
    const a = Math.atan2(p2.y - p1.y, p2.x - p1.x);
    const h = Math.PI / 2;
    c.beginPath();
    c.moveTo(p1.x + Math.cos(a + h) * r1, p1.y + Math.sin(a + h) * r1);
    c.lineTo(p2.x + Math.cos(a + h) * r2, p2.y + Math.sin(a + h) * r2);
    c.arc(p2.x, p2.y, r2, a + h, a - h, true);
    c.lineTo(p1.x + Math.cos(a - h) * r1, p1.y + Math.sin(a - h) * r1);
    c.arc(p1.x, p1.y, r1, a - h, a + h, true);
    c.closePath();
  }
  function limb(p1, r1, p2, r2, fill, stroke, lw) {
    capsulePath(ctx, p1, r1, p2, r2);
    ctx.fillStyle = fill; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke();
  }

  // Boot in a local frame: u along toe, n toward the sole.
  function bootPath(ank, toeVec) {
    const u = norm(toeVec);
    let n = { x: -u.y, y: u.x };
    if (n.y < 0 || (Math.abs(n.y) < 0.2 && n.x > 0 && u.y > 0)) n = { x: u.y, y: -u.x };
    const L = len(toeVec);
    const pt = (a, b) => ({ x: ank.x + u.x * a + n.x * b, y: ank.y + u.y * a + n.y * b });
    const pts = [pt(-6, -14), pt(-19, -2), pt(-18, 14), pt(-6, 20), pt(L - 6, 18),
                 pt(L + 6, 11), pt(L + 5, 1), pt(L - 10, -6), pt(14, -14)];
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      const p0 = pts[i - 1], p1 = pts[i];
      ctx.quadraticCurveTo(p0.x, p0.y, (p0.x + p1.x) / 2, (p0.y + p1.y) / 2);
    }
    ctx.quadraticCurveTo(pts[pts.length - 1].x, pts[pts.length - 1].y, pts[0].x, pts[0].y);
    ctx.closePath();
    return { u, n, pt };
  }

  function drawLeg(hip, knee, ank, toe, style) {
    const { fill, stroke, lw, band } = style;
    if (style.halo) {
      // Comic-book knockout: a thick black rim around the support leg cuts a
      // gap into anything drawn behind it, so the overlap reads as depth.
      ctx.save();
      ctx.strokeStyle = '#000'; ctx.lineWidth = style.halo; ctx.lineJoin = 'round';
      capsulePath(ctx, hip, 30, knee, 19); ctx.stroke();
      capsulePath(ctx, knee, 19, ank, 12); ctx.stroke();
      bootPath(ank, toe); ctx.stroke();
      ctx.restore();
    }
    // thigh
    limb(hip, 30, knee, 19, fill, stroke, lw);
    // shin (sock)
    limb(knee, 19, ank, 12, fill, stroke, lw);
    // sock band just below the knee
    const d = norm(sub(ank, knee));
    const b0 = add(knee, mul(d, 30)), b1 = add(knee, mul(d, 46));
    limb(b0, 17.5, b1, 16.5, band, stroke, lw * 0.7);
    // boot
    const f = bootPath(ank, toe);
    ctx.fillStyle = style.boot; ctx.fill();
    ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke();
    // lace hint
    ctx.beginPath();
    const l0 = f.pt(6, -8), l1 = f.pt(26, -4);
    ctx.moveTo(l0.x, l0.y); ctx.lineTo(l1.x, l1.y);
    ctx.lineWidth = 1.4; ctx.strokeStyle = style.lace; ctx.stroke();
  }

  const KICK_STYLE = {
    fill: COL.blueFill, stroke: COL.blueLine, lw: 2.6,
    band: '#4a5c6d', boot: '#33424f', lace: '#9fb2c4',
  };
  const SUPPORT_STYLE = {
    fill: COL.black, stroke: COL.ink, lw: 3.6,
    band: '#2a2a2a', boot: '#000', lace: COL.inkSoft, halo: 16,
  };

  // ---------------------------------------------------------------
  //  Background (painted once)
  // ---------------------------------------------------------------
  const bg = document.createElement('canvas');
  bg.width = W; bg.height = H;
  (function paintBackground() {
    const g = bg.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    // dry-brush strokes, desaturated blue-gray
    for (let i = 0; i < 70; i++) {
      const y = GROUND_Y - 120 + rnd() * 220;
      const x = rnd() * W;
      const w = 200 + rnd() * 700;
      g.strokeStyle = `rgba(70, 88, 106, ${0.05 + rnd() * 0.12})`;
      g.lineWidth = 1 + rnd() * 6;
      g.beginPath();
      g.moveTo(x, y);
      g.quadraticCurveTo(x + w / 2, y - 20 - rnd() * 30, x + w, y + (rnd() - 0.5) * 30);
      g.stroke();
    }
    // ground plane
    const grd = g.createLinearGradient(0, GROUND_Y - 10, 0, H);
    grd.addColorStop(0, 'rgba(40, 52, 64, 0.55)');
    grd.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = grd; g.fillRect(0, GROUND_Y - 10, W, H - GROUND_Y + 10);
    // broken ground line
    g.strokeStyle = 'rgba(200, 200, 195, 0.35)'; g.lineWidth = 1.5;
    for (let x = 60; x < W - 60;) {
      const w = 40 + rnd() * 200;
      g.beginPath(); g.moveTo(x, GROUND_Y + 4 + rnd() * 3); g.lineTo(x + w, GROUND_Y + 4 + rnd() * 3); g.stroke();
      x += w + 10 + rnd() * 60;
    }
    // one faint gold streak
    g.strokeStyle = 'rgba(201, 168, 74, 0.18)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(140, GROUND_Y - 40); g.quadraticCurveTo(700, GROUND_Y - 110, 1500, GROUND_Y - 30); g.stroke();
    // grain
    const img = g.getImageData(0, 0, W, H);
    for (let i = 0; i < img.data.length; i += 4) {
      const n = (rnd() - 0.5) * 10;
      img.data[i] += n; img.data[i + 1] += n; img.data[i + 2] += n;
    }
    g.putImageData(img, 0, 0);
    // vignette
    const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.85)');
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  })();

  // ---------------------------------------------------------------
  //  Body parts
  // ---------------------------------------------------------------
  function drawArm(sh, el, hand, style) {
    limb(sh, 17, el, 13, style.fill, style.stroke, style.lw);
    limb(el, 13, hand, 10, style.fill, style.stroke, style.lw);
    ctx.beginPath(); ctx.arc(hand.x, hand.y, 12, 0, Math.PI * 2);
    ctx.fillStyle = style.fill; ctx.fill(); ctx.strokeStyle = style.stroke; ctx.lineWidth = style.lw; ctx.stroke();
  }

  // Torso frame: `up` along the spine, `right` = screen-right across the body.
  function frame(r) {
    const up = norm(sub(r.neck, r.pelvis));
    return { up, right: { x: -up.y, y: up.x } };
  }

  function torsoPath(r) {
    const { up, right } = frame(r);
    const waistL = add(r.pelvis, add(mul(right, -44), mul(up, 34)));
    const waistR = add(r.pelvis, add(mul(right, 46), mul(up, 34)));
    const shL = add(r.nShoulder, add(mul(right, -10), mul(up, -4)));
    const shR = add(r.fShoulder, add(mul(right, 10), mul(up, -4)));
    const chestL = add(lerpP(waistL, shL, 0.55), mul(right, -8));
    const chestR = add(lerpP(waistR, shR, 0.55), mul(right, 6));
    ctx.beginPath();
    ctx.moveTo(waistL.x, waistL.y);
    ctx.quadraticCurveTo(chestL.x, chestL.y, shL.x, shL.y);
    ctx.quadraticCurveTo(r.neck.x, r.neck.y - 22, shR.x, shR.y);
    ctx.quadraticCurveTo(chestR.x, chestR.y, waistR.x, waistR.y);
    ctx.closePath();
  }

  function drawTorso(r) {
    const { up, right } = frame(r);
    torsoPath(r);
    ctx.fillStyle = COL.black; ctx.fill();
    ctx.save();
    torsoPath(r); ctx.clip();
    // vertical stripes
    for (let i = -5; i <= 5; i += 2) {
      const base = add(r.pelvis, mul(right, i * 13));
      const top = add(base, mul(up, 320));
      ctx.beginPath(); ctx.moveTo(base.x, base.y); ctx.lineTo(top.x, top.y);
      ctx.lineWidth = 11; ctx.strokeStyle = 'rgba(214,211,204,0.72)'; ctx.stroke();
    }
    // shadow side (screen-right, away from the key light): deep black + hatching
    const sh0 = add(r.pelvis, mul(right, 22));
    ctx.beginPath();
    ctx.moveTo(sh0.x, sh0.y);
    const sh1 = add(sh0, mul(up, 320));
    ctx.lineTo(sh1.x, sh1.y);
    ctx.lineTo(sh1.x + right.x * 120, sh1.y + right.y * 120);
    ctx.lineTo(sh0.x + right.x * 120, sh0.y + right.y * 120);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fill();
    for (let k = 0; k < 20; k++) {
      const p0 = add(sh0, add(mul(up, 20 + k * 13), mul(right, -14)));
      ctx.beginPath(); ctx.moveTo(p0.x, p0.y); ctx.lineTo(p0.x + 34, p0.y - 16);
      ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(143,160,176,0.35)'; ctx.stroke();
    }
    ctx.restore();
    torsoPath(r);
    ctx.lineWidth = 3.4; ctx.strokeStyle = COL.ink; ctx.stroke();
    // collar
    ctx.beginPath();
    ctx.moveTo(r.neck.x - 22, r.neck.y - 2); ctx.lineTo(r.neck.x - 6, r.neck.y + 20); ctx.lineTo(r.neck.x + 18, r.neck.y - 4);
    ctx.lineWidth = 2.6; ctx.stroke();
  }

  // Perpendicular of d that points toward screen-left (sign=-1) or right (+1).
  function perpToward(d, sign) {
    const p = { x: -d.y, y: d.x };
    return (p.x * sign >= 0) ? p : { x: -p.x, y: -p.y };
  }

  function shortsPath(r) {
    const { up, right } = frame(r);
    const top = add(r.pelvis, mul(up, 36));
    const topL = add(top, mul(right, -48)), topR = add(top, mul(right, 50));
    const sd = norm(sub(r.sKnee, r.sHip)), kd = norm(sub(r.kKnee, r.kHip));
    const sHem = add(r.sHip, mul(sd, 76));
    const kHem = add(r.kHip, mul(kd, 72));
    const sOut = add(sHem, mul(perpToward(sd, -1), 33));
    const sIn  = add(sHem, mul(perpToward(sd, 1), 29));
    const kOut = add(kHem, mul(perpToward(kd, 1), 33));
    const kIn  = add(kHem, mul(perpToward(kd, -1), 29));
    const crotch = add(r.pelvis, mul(up, -30));
    ctx.beginPath();
    ctx.moveTo(topL.x, topL.y);
    ctx.lineTo(sOut.x, sOut.y);
    ctx.lineTo(sIn.x, sIn.y);
    ctx.lineTo(crotch.x, crotch.y);
    ctx.lineTo(kIn.x, kIn.y);
    ctx.lineTo(kOut.x, kOut.y);
    ctx.lineTo(topR.x, topR.y);
    ctx.closePath();
    return { crotch, sHem, kHem };
  }
  function drawShorts(r) {
    const s = shortsPath(r);
    ctx.fillStyle = '#0b0e12'; ctx.fill();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 3.2; ctx.strokeStyle = COL.ink; ctx.stroke();
    // fold line
    ctx.beginPath(); ctx.moveTo(s.crotch.x + 2, s.crotch.y - 40); ctx.lineTo(s.crotch.x, s.crotch.y - 4);
    ctx.lineWidth = 1.6; ctx.strokeStyle = COL.gray; ctx.stroke();
  }

  function drawHead(r) {
    const h = r.head;
    ctx.save();
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // neck
    ctx.beginPath(); ctx.moveTo(h.x - 8, h.y + 30); ctx.lineTo(r.neck.x - 8, r.neck.y + 4);
    ctx.lineTo(r.neck.x + 14, r.neck.y); ctx.lineTo(h.x + 16, h.y + 26); ctx.closePath();
    ctx.fillStyle = '#121518'; ctx.fill(); ctx.lineWidth = 2.6; ctx.strokeStyle = COL.ink; ctx.stroke();
    // skull + face, looking down-left at the ball
    ctx.beginPath();
    ctx.moveTo(h.x + 30, h.y - 10);
    ctx.bezierCurveTo(h.x + 34, h.y - 46, h.x - 22, h.y - 52, h.x - 30, h.y - 16); // crown → brow
    ctx.lineTo(h.x - 40, h.y + 4);   // nose
    ctx.lineTo(h.x - 30, h.y + 8);
    ctx.lineTo(h.x - 32, h.y + 20);  // lips/chin
    ctx.quadraticCurveTo(h.x - 22, h.y + 38, h.x, h.y + 36); // jaw
    ctx.quadraticCurveTo(h.x + 26, h.y + 28, h.x + 30, h.y - 10);
    ctx.closePath();
    ctx.fillStyle = '#121518'; ctx.fill();
    ctx.lineWidth = 3.2; ctx.strokeStyle = COL.ink; ctx.stroke();
    // slicked-back hair: black mass sweeping to the back of the head
    ctx.beginPath();
    ctx.moveTo(h.x - 28, h.y - 20);
    ctx.bezierCurveTo(h.x - 22, h.y - 54, h.x + 30, h.y - 54, h.x + 38, h.y - 18);
    ctx.quadraticCurveTo(h.x + 40, h.y + 2, h.x + 28, h.y + 10);
    ctx.quadraticCurveTo(h.x + 20, h.y - 16, h.x - 6, h.y - 22);
    ctx.closePath();
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.lineWidth = 2.4; ctx.strokeStyle = COL.ink; ctx.stroke();
    // gloss strokes
    ctx.beginPath();
    ctx.moveTo(h.x - 14, h.y - 36); ctx.quadraticCurveTo(h.x + 10, h.y - 46, h.x + 30, h.y - 26);
    ctx.moveTo(h.x - 4, h.y - 28); ctx.quadraticCurveTo(h.x + 16, h.y - 34, h.x + 30, h.y - 12);
    ctx.lineWidth = 1.3; ctx.strokeStyle = COL.gray; ctx.stroke();
    // ear + eye
    ctx.beginPath(); ctx.ellipse(h.x + 10, h.y + 2, 6, 9, 0.2, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = COL.inkSoft; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(h.x - 26, h.y - 6); ctx.lineTo(h.x - 17, h.y - 4);
    ctx.lineWidth = 2.2; ctx.strokeStyle = COL.ink; ctx.stroke();
    ctx.restore();
  }

  function drawBall(b) {
    // ground shadow
    const shY = GROUND_Y + 2;
    const lift = Math.max(0, BALL_REST.y - b.y);
    ctx.beginPath();
    ctx.ellipse(b.x + lift * 0.1, shY, Math.max(10, 34 - lift * 0.08), 6, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(0,0,0,${0.85 - Math.min(0.6, lift / 400)})`; ctx.fill();
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(1 - b.squash, 1 + b.squash * 0.6);
    ctx.rotate(b.rot);
    ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = '#e6e2d8'; ctx.fill();
    // panels
    ctx.save(); ctx.clip();
    ctx.fillStyle = '#1a1a1a';
    const pent = (cx, cy, r, a) => {
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const t = a + i * Math.PI * 2 / 5;
        ctx[i ? 'lineTo' : 'moveTo'](cx + Math.cos(t) * r, cy + Math.sin(t) * r);
      }
      ctx.closePath(); ctx.fill();
    };
    pent(0, 0, 9, -Math.PI / 2);
    for (let i = 0; i < 5; i++) {
      const t = -Math.PI / 2 + i * Math.PI * 2 / 5 + Math.PI / 5;
      pent(Math.cos(t) * 27, Math.sin(t) * 27, 8, t);
    }
    // shadow crescent
    ctx.beginPath(); ctx.arc(10, 8, BALL_R, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(0, 0, BALL_R, 0, Math.PI * 2);
    ctx.lineWidth = 3; ctx.strokeStyle = COL.ink; ctx.stroke();
    ctx.restore();
  }

  function drawSpeedLines(b, t) {
    if (!b.moving) return;
    const fade = Math.min(1, (t - T_CONTACT) / 0.08);
    ctx.save();
    ctx.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const off = (i - 2.5) * 11;
      const L = 60 + (i % 3) * 40;
      ctx.beginPath();
      ctx.moveTo(b.x + 40, b.y + off);
      ctx.lineTo(b.x + 40 + L, b.y + off + L * 0.22);
      ctx.lineWidth = i === 2 ? 2 : 1.3;
      ctx.strokeStyle = i === 2 ? `rgba(201,168,74,${0.55 * fade})` : `rgba(210,215,220,${0.45 * fade})`;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawImpact(t) {
    const dt = t - T_CONTACT;
    if (dt < 0 || dt > 0.16) return;
    const k = dt / 0.16;
    const c = { x: BALL_REST.x + 30, y: BALL_REST.y };
    ctx.save();
    ctx.globalAlpha = 1 - k;
    for (let i = 0; i < 9; i++) {
      const a = -Math.PI * 0.95 + i * (Math.PI * 1.1 / 8);
      const r0 = 38 + k * 20, r1 = 70 + k * 50 + (i % 2) * 18;
      ctx.beginPath();
      ctx.moveTo(c.x + Math.cos(a) * r0, c.y + Math.sin(a) * r0);
      ctx.lineTo(c.x + Math.cos(a) * r1, c.y + Math.sin(a) * r1);
      ctx.lineWidth = i % 3 === 1 ? 3 : 1.6;
      ctx.strokeStyle = i % 3 === 1 ? COL.gold : COL.ink;
      ctx.stroke();
    }
    ctx.restore();
  }

  // Kick-foot trail — drawn on the kick-leg layer so the trail itself is
  // hidden where it passes behind the support leg.
  function drawKickTrail(t) {
    const t0 = Math.max(0.5, t - 0.28);
    if (t <= 0.52 || t > 2.3) return;
    const steps = 22;
    ctx.save();
    ctx.lineCap = 'round';
    let prev = null;
    for (let i = 0; i <= steps; i++) {
      const tt = t0 + (t - t0) * (i / steps);
      const r = sampleRig(tt);
      const toe = add(r.kAnk, mul(norm(r.kToe), 40));
      if (prev) {
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(toe.x, toe.y);
        ctx.lineWidth = 1 + 7 * (i / steps);
        ctx.strokeStyle = `rgba(143,160,176,${0.5 * (i / steps)})`;
        ctx.stroke();
      }
      prev = toe;
    }
    ctx.restore();
  }

  // Support leg's shadow falling onto the kick leg behind it: the support
  // leg silhouette, offset away from the key light, clipped to the kick leg.
  function drawCastShadow(r) {
    ctx.save();
    const clip = new Path2D();
    const addCaps = (p1, r1, p2, r2) => {
      const a = Math.atan2(p2.y - p1.y, p2.x - p1.x), h = Math.PI / 2;
      clip.moveTo(p1.x + Math.cos(a + h) * r1, p1.y + Math.sin(a + h) * r1);
      clip.lineTo(p2.x + Math.cos(a + h) * r2, p2.y + Math.sin(a + h) * r2);
      clip.arc(p2.x, p2.y, r2, a + h, a - h, true);
      clip.lineTo(p1.x + Math.cos(a - h) * r1, p1.y + Math.sin(a - h) * r1);
      clip.arc(p1.x, p1.y, r1, a - h, a + h, true);
      clip.closePath();
    };
    addCaps(r.kHip, 30, r.kKnee, 19);
    addCaps(r.kKnee, 19, r.kAnk, 12);
    ctx.clip(clip);
    const off = { x: 22, y: 6 };
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    capsulePath(ctx, add(r.sHip, off), 30, add(r.sKnee, off), 19); ctx.fill();
    capsulePath(ctx, add(r.sKnee, off), 19, add(r.sAnk, off), 12); ctx.fill();
    ctx.restore();
  }

  // Explicit depth order, back to front. The kick leg is ALWAYS drawn before
  // the support leg, so the support leg occludes it wherever they overlap.
  const LAYERS = [
    ['far arm',     r => drawArm(r.fShoulder, r.fElbow, r.fHand, { fill: '#10151b', stroke: COL.gray, lw: 2.4 })],
    ['kick trail',  (r, t, alpha) => { if (alpha === 1) drawKickTrail(t); }],
    ['KICK LEG',    r => drawLeg(r.kHip, r.kKnee, r.kAnk, r.kToe, KICK_STYLE)],
    ['cast shadow', r => drawCastShadow(r)],
    ['ankle path',  () => { if (state.pathT != null) drawAnklePath(state.pathT); }],
    ['SUPPORT LEG', r => drawLeg(r.sHip, r.sKnee, r.sAnk, r.sToe, SUPPORT_STYLE)],
    ['shorts',      r => drawShorts(r)],
    ['torso',       r => drawTorso(r)],
    ['head',        r => drawHead(r)],
    ['near arm',    r => drawArm(r.nShoulder, r.nElbow, r.nHand, { fill: COL.black, stroke: COL.ink, lw: 3.2 })],
  ];

  const layerIndex = name => LAYERS.findIndex(l => l[0] === name);

  function drawCharacter(r, t, alpha = 1) {
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    // contact shadow under the planted foot
    ctx.beginPath(); ctx.ellipse(r.sAnk.x - 20, GROUND_Y + 2, 70, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fill();
    for (const [, draw] of LAYERS) draw(r, t, alpha);
    ctx.restore();
  }

  // ---------------------------------------------------------------
  //  Analysis helpers (used by debug overlay and automated checks)
  // ---------------------------------------------------------------
  function segIntersect(p1, p2, p3, p4) {
    const d = (p2.x - p1.x) * (p4.y - p3.y) - (p2.y - p1.y) * (p4.x - p3.x);
    if (Math.abs(d) < 1e-9) return null;
    const u = ((p3.x - p1.x) * (p4.y - p3.y) - (p3.y - p1.y) * (p4.x - p3.x)) / d;
    const v = ((p3.x - p1.x) * (p2.y - p1.y) - (p3.y - p1.y) * (p2.x - p1.x)) / d;
    if (u < 0 || u > 1 || v < 0 || v > 1) return null;
    return { x: p1.x + u * (p2.x - p1.x), y: p1.y + u * (p2.y - p1.y) };
  }
  // Signed side of point p relative to the support leg line (hip→ankle).
  // > 0 = kick side (screen-right / behind), < 0 = ball side.
  function sideOfSupport(r, p) {
    const a = r.sKnee, b = r.sAnk;
    return (b.x - a.x) * (p.y - a.y) - (b.y - a.y) * (p.x - a.x) < 0 ? 1 : -1;
  }
  function analyze(t) {
    const r = sampleRig(t);
    const shinX = segIntersect(r.kKnee, r.kAnk, r.sKnee, r.sAnk);
    const toe = add(r.kAnk, mul(norm(r.kToe), len(r.kToe)));
    return {
      t,
      supportAnkle: r.sAnk,
      shinsCross: !!shinX,
      crossPoint: shinX,
      kickLayer: layerIndex('KICK LEG') < layerIndex('SUPPORT LEG') ? 'behind' : 'IN FRONT',
      kickFootSide: sideOfSupport(r, r.kAnk) > 0 ? 'kick side' : 'ball side',
      kickKneeSide: sideOfSupport(r, r.kKnee) > 0 ? 'kick side' : 'ball side',
      toe,
      toeToBall: Math.hypot(toe.x - BALL_REST.x, toe.y - BALL_REST.y) - BALL_R,
    };
  }

  function drawDebug(r, t) {
    ctx.save();
    // full ankle path, split by which side of the support shin it is on
    let prev = null;
    for (let i = 0; i <= 200; i++) {
      const tt = 0.5 + (T_CONTACT - 0.5) * i / 200;
      const rr = sampleRig(tt);
      const p = rr.kAnk;
      if (prev) {
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y);
        ctx.strokeStyle = sideOfSupport(rr, p) > 0 ? 'rgba(143,160,176,0.9)' : 'rgba(201,168,74,0.9)';
        ctx.lineWidth = 2; ctx.setLineDash([6, 5]); ctx.stroke();
      }
      prev = p;
    }
    ctx.setLineDash([]);
    // joints
    const dot = (p, c) => { ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); };
    ['kHip', 'kKnee', 'kAnk'].forEach(k => dot(r[k], '#8fa0b0'));
    ['sHip', 'sKnee', 'sAnk'].forEach(k => dot(r[k], '#fff'));
    // support ankle pin
    ctx.strokeStyle = COL.gold; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.sAnk.x - 14, r.sAnk.y); ctx.lineTo(r.sAnk.x + 14, r.sAnk.y);
    ctx.moveTo(r.sAnk.x, r.sAnk.y - 14); ctx.lineTo(r.sAnk.x, r.sAnk.y + 14); ctx.stroke();
    const a = analyze(t);
    if (a.crossPoint) {
      ctx.beginPath(); ctx.arc(a.crossPoint.x, a.crossPoint.y, 12, 0, Math.PI * 2);
      ctx.strokeStyle = COL.gold; ctx.stroke();
    }
    ctx.font = '600 18px Helvetica Neue, Arial';
    ctx.fillStyle = COL.ink;
    const lines = [
      `support ankle  (${r.sAnk.x.toFixed(0)}, ${r.sAnk.y.toFixed(0)})  PINNED`,
      `kick leg layer  ${a.kickLayer.toUpperCase()} support leg (draw order)`,
      `shins cross (X)  ${a.shinsCross ? 'YES' : 'no'}`,
      `kick foot on    ${a.kickFootSide}`,
      `toe → ball      ${a.toeToBall.toFixed(0)} px`,
    ];
    lines.forEach((s, i) => ctx.fillText(s, 60, 150 + i * 26));
    ctx.fillStyle = 'rgba(143,160,176,0.9)'; ctx.fillText('— ankle path on kick side', 60, 150 + lines.length * 26 + 10);
    ctx.fillStyle = 'rgba(201,168,74,0.9)'; ctx.fillText('— ankle path on ball side (reached only by passing behind)', 60, 150 + lines.length * 26 + 36);
    ctx.restore();
  }

  function phaseOf(t) {
    if (t < 0.5) return 'A — PREPARATION';
    if (t < 1.02) return 'KICK LEG SWINGS ACROSS THE BODY';
    if (t < 1.27) return 'B — LEG CROSSING BEHIND THE SUPPORT LEG';
    if (t < 1.58) return 'C — CROSSED POSITION · FOOT EMERGES ON THE BALL SIDE';
    if (t < 1.74) return 'D — CONTACT';
    return 'E — BALL LEAVES THE FOOT';
  }

  function drawHUD(t) {
    ctx.save();
    ctx.font = '500 20px Helvetica Neue, Arial';
    ctx.fillStyle = COL.gray;
    ctx.fillText('RABONA  ·  MOTION PROTOTYPE 01', 60, 70);
    ctx.font = '600 22px Helvetica Neue, Arial';
    ctx.fillStyle = COL.ink;
    ctx.fillText(phaseOf(t), 60, 104);
    // timeline
    const x0 = 60, x1 = W - 60, y = H - 60;
    ctx.strokeStyle = '#3a434c'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
    const X = tt => x0 + (x1 - x0) * tt / DURATION;
    SHEET.map(k => [k.t, k.id]).forEach(([tt, n]) => {
      ctx.fillStyle = COL.gray;
      ctx.fillRect(X(tt) - 1, y - 10, 2, 20);
      ctx.font = '600 16px Helvetica Neue, Arial';
      ctx.fillText(n, X(tt) + 6, y - 14);
    });
    ctx.fillStyle = COL.gold;
    ctx.beginPath(); ctx.arc(X(Math.min(t, DURATION)), y, 6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------
  //  Frame
  // ---------------------------------------------------------------
  const state = {
    t: 0, playing: true, speed: 1, debug: false, ghosts: false, hud: true, pathT: null,
  };

  function render(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bg, 0, 0);
    const at = Math.min(t, DURATION);
    const r = sampleRig(at);
    const b = ballState(at);
    if (state.ghosts) {
      for (const [gt] of [[0.5], [1.40], [T_CONTACT]]) {
        if (Math.abs(gt - at) > 0.05) drawCharacter(sampleRig(gt), gt, 0.16);
      }
    }
    // ball behind or in front? It sits closer to camera than the kick foot,
    // so it goes on top of the legs.
    drawCharacter(r, at);
    drawSpeedLines(b, at);
    drawBall(b);
    drawImpact(at);
    if (state.debug) drawDebug(r, at);
    if (state.hud) drawHUD(at);
  }

  // ---------------------------------------------------------------
  //  Keyframe sheet (?sheet=1): full-body row + leg close-up row
  // ---------------------------------------------------------------
  const SHEET_NOTES = {
    A: 'Support foot planted beside the ball. Kick leg on its own side, behind the body.',
    B: 'Kick ankle passes directly behind the support shin and is hidden by it.',
    C: 'Shins form an X. Boot is out on the ball side, still travelling on the strike line.',
    D: 'Same foot, same line: the toe meets the ball. Kick shin is still behind.',
    E: 'Ball leaves the foot at once; the foot carries on along the same line.',
  };

  function drawAnklePath(tNow) {
    ctx.save();
    ctx.lineCap = 'round';
    let prev = null;
    for (let i = 0; i <= 240; i++) {
      const tt = 0.5 + (1.9 - 0.5) * i / 240;
      const rr = sampleRig(tt);
      const p = rr.kAnk;
      if (prev) {
        ctx.beginPath(); ctx.moveTo(prev.x, prev.y); ctx.lineTo(p.x, p.y);
        ctx.setLineDash(tt <= tNow ? [] : [5, 6]);
        ctx.lineWidth = tt <= tNow ? 2.6 : 1.6;
        ctx.strokeStyle = sideOfSupport(rr, p) > 0 ? 'rgba(159,178,196,0.95)' : 'rgba(201,168,74,0.95)';
        ctx.stroke();
      }
      prev = p;
    }
    ctx.setLineDash([]);
    const r = sampleRig(Math.min(tNow, 1.9));
    ctx.beginPath(); ctx.arc(r.kAnk.x, r.kAnk.y, 6, 0, Math.PI * 2);
    ctx.fillStyle = COL.gold; ctx.fill();
    ctx.restore();
  }
  function drawCrossRing(tNow) {
    const a = analyze(tNow);
    if (!a.crossPoint) return;
    ctx.beginPath(); ctx.arc(a.crossPoint.x, a.crossPoint.y, 14, 0, Math.PI * 2);
    ctx.lineWidth = 2; ctx.strokeStyle = COL.gold; ctx.stroke();
  }

  function wrapText(g, text, x, y, maxW, lh) {
    let line = '';
    for (const w of text.split(' ')) {
      const test = line ? line + ' ' + w : w;
      if (g.measureText(test).width > maxW && line) { g.fillText(line, x, y); line = w; y += lh; }
      else line = test;
    }
    if (line) g.fillText(line, x, y);
  }

  function renderSheet() {
    const PW = 560, GAP = 30, M = 60;
    const SW = M * 2 + PW * 5 + GAP * 4;           // 3020
    const ROW1 = 620, ROW2 = 560, HEAD = 280, CAP = 150;
    const SH = HEAD + ROW1 + 24 + ROW2 + CAP + 40;
    const sheet = document.createElement('canvas');
    sheet.width = SW; sheet.height = SH;
    const g = sheet.getContext('2d');
    g.fillStyle = '#000'; g.fillRect(0, 0, SW, SH);
    g.fillStyle = COL.gray; g.font = '500 26px Helvetica Neue, Arial';
    g.fillText('RABONA  ·  BIOMECHANICAL KEYFRAME SHEET  ·  TECHNICAL REFERENCE', M, 70);
    g.fillStyle = COL.ink; g.font = '600 34px Helvetica Neue, Arial';
    g.fillText('Left-footed rabona — support (right) leg in front and pinned; kick (left) leg passes behind it and strikes on one continuous line', M, 120);
    // legend
    g.font = '500 22px Helvetica Neue, Arial';
    const lx = M, ly = 156;
    g.fillStyle = COL.ink; g.fillText('■ support leg (front layer)', lx, ly);
    g.fillStyle = COL.blueLine; g.fillText('■ kick leg (back layer)', lx + 330, ly);
    g.fillStyle = COL.blueLine; g.fillText('— ankle path, kick side', lx + 640, ly);
    g.fillStyle = COL.gold; g.fillText('— ankle path, ball side (only reached by passing behind)   · solid = travelled, dashed = still to come', lx + 930, ly);
    g.fillStyle = COL.gold; g.fillText('○ shins cross (support shin in front)', lx, ly + 34);

    const prevHud = state.hud, prevDbg = state.debug, prevGh = state.ghosts;
    state.hud = false; state.debug = false; state.ghosts = false;
    SHEET.forEach((k, i) => {
      const x = M + i * (PW + GAP);
      // row 1: full body
      render(k.t);
      g.drawImage(cv, 520, 190, 740, 820, x, HEAD, PW, ROW1);
      g.strokeStyle = '#2a323a'; g.lineWidth = 2; g.strokeRect(x, HEAD, PW, ROW1);
      g.fillStyle = COL.gold; g.font = '700 46px Helvetica Neue, Arial'; g.fillText(k.id, x + 2, HEAD - 16);
      g.fillStyle = COL.ink; g.font = '600 24px Helvetica Neue, Arial'; g.fillText(k.label, x + 46, HEAD - 22);
      g.fillStyle = COL.gray; g.font = '500 20px Helvetica Neue, Arial'; g.fillText(k.t.toFixed(2) + ' s', x + PW - 70, HEAD - 22);
      // row 2: legs close-up with ankle path
      state.pathT = k.t;
      render(k.t);
      state.pathT = null;
      drawCrossRing(k.t);
      const y2 = HEAD + ROW1 + 24;
      g.drawImage(cv, 720, 560, 460, 460, x, y2, PW, ROW2);
      g.strokeStyle = '#2a323a'; g.strokeRect(x, y2, PW, ROW2);
      g.fillStyle = COL.gray; g.font = '500 18px Helvetica Neue, Arial'; g.fillText('LEGS · 1.2×', x + 14, y2 + 28);
      // caption
      g.fillStyle = COL.ink; g.font = '500 23px Helvetica Neue, Arial';
      wrapText(g, SHEET_NOTES[k.id], x + 4, y2 + ROW2 + 40, PW - 8, 31);
    });
    state.hud = prevHud; state.debug = prevDbg; state.ghosts = prevGh;
    render(state.t);
    return sheet;
  }

  // ---------------------------------------------------------------
  //  Playback + controls
  // ---------------------------------------------------------------
  const $ = id => document.getElementById(id);
  const ui = { play: $('play'), slow: $('slow'), debug: $('debug'), ghost: $('ghost'), scrub: $('scrub'), tl: $('tlabel') };
  function syncUI() {
    ui.play.textContent = state.playing ? 'Pause' : 'Play';
    ui.play.setAttribute('aria-pressed', state.playing);
    ui.slow.setAttribute('aria-pressed', state.speed !== 1);
    ui.debug.setAttribute('aria-pressed', state.debug);
    ui.ghost.setAttribute('aria-pressed', state.ghosts);
    ui.scrub.value = Math.min(state.t, DURATION);
    ui.tl.textContent = Math.min(state.t, DURATION).toFixed(2) + ' s';
  }
  ui.play.onclick = () => { state.playing = !state.playing; syncUI(); };
  ui.slow.onclick = () => { state.speed = state.speed === 1 ? 0.25 : 1; syncUI(); };
  ui.debug.onclick = () => { state.debug = !state.debug; render(state.t); syncUI(); };
  ui.ghost.onclick = () => { state.ghosts = !state.ghosts; render(state.t); syncUI(); };
  ui.scrub.oninput = () => { state.t = +ui.scrub.value; state.playing = false; render(state.t); syncUI(); };
  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); ui.play.onclick(); }
    else if (e.key === 'ArrowRight') { state.playing = false; state.t = Math.min(DURATION, state.t + 1 / 30); render(state.t); syncUI(); }
    else if (e.key === 'ArrowLeft') { state.playing = false; state.t = Math.max(0, state.t - 1 / 30); render(state.t); syncUI(); }
    else if (e.key === 's' || e.key === 'S') ui.slow.onclick();
    else if (e.key === 'd' || e.key === 'D') ui.debug.onclick();
    else if (e.key === 'g' || e.key === 'G') ui.ghost.onclick();
  });

  // URL params: ?t=1.1 freezes a frame, ?debug=1, ?ghosts=1, ?slow=1
  const q = new URLSearchParams(location.search);
  if (q.has('debug')) state.debug = true;
  if (q.has('ghosts')) state.ghosts = true;
  if (q.has('slow')) state.speed = 0.25;
  if (q.has('t')) { state.t = +q.get('t'); state.playing = false; }

  let last = null;
  function tick(now) {
    if (last !== null && state.playing) {
      state.t += Math.min(0.05, (now - last) / 1000) * state.speed;
      if (state.t > DURATION + LOOP_HOLD) state.t = 0;
      syncUI();
    }
    last = now;
    render(state.t);
    requestAnimationFrame(tick);
  }
  syncUI();
  render(state.t);
  if (q.has('sheet')) {
    const sheet = renderSheet();
    sheet.style.cssText = 'width:100%;height:auto;display:block';
    document.body.style.overflow = 'auto';
    document.body.style.justifyContent = 'flex-start';
    const stage = document.querySelector('.stage');
    stage.style.aspectRatio = 'auto';
    stage.style.width = '100%';
    stage.replaceChildren(sheet);
    document.querySelector('.controls').remove();
  } else {
    requestAnimationFrame(tick);
  }

  // Hooks for automated inspection
  window.rabona = {
    setTime(t) { state.t = t; state.playing = false; render(t); syncUI(); },
    sampleRig, analyze, ballState, KEYS, SHEET,
    sheetDataURL() { return renderSheet().toDataURL('image/png'); },
  };
})();
</script>
</body>
</html>
